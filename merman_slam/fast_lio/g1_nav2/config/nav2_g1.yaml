# ============================================================
# G1 minimal Nav2
#
# 运动模型：
#   Nav2 只允许 vx + wz
#   vy 恒为 0
#
# 实车四轮四转由 pseudo_diff_4wis_controller 完成。
#
# 定位 / 地图：
#   /Odometry_loc : FAST-LIO / Open3D
#   /nav2_scan    : FAST-LIO 内部生成
#   /map          : map_server / Open3D 链路
#   map -> odom   : Open3D localization
#
# 本包不启动：
#   AMCL
#   Nav2 map_server
#   map_saver
#   velocity_smoother
#   smoother_server
#   waypoint_follower
# ============================================================


bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /Odometry_loc
    bt_loop_duration: 10
    default_server_timeout: 20

    # ROS2 Humble 保留显式 BT plugin list。
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

    default_nav_to_pose_bt_xml: /home/niic/slam_nav/merman_slam/fast_lio/install/g1_nav2/share/g1_nav2/behavior_trees/g1_navigate_to_pose.xml


controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 20.0
    odom_topic: /Odometry_loc

    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 3.0

    # Humble 使用 singular progress_checker_plugin
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2

      # 暂时保持你原配置：
      # 到达位置即可，不强制最终朝向。
      # 如果后续需要严格终点朝向，再改成 0.2~0.3。
      yaw_goal_tolerance: 3.14159

    FollowPath:
      # --------------------------------------------------------
      # 只在原有 DWB 外包一层 Rotation Shim。
      #
      # 目的：
      #   新路径方向与当前车头偏差较大时，先原地旋转对齐；
      #   对齐后仍完全交回原有 DWB 做路径跟踪和局部避障。
      #
      # 除这一层外，下面已有 DWB 参数全部保持原样。
      # --------------------------------------------------------
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: dwb_core::DWBLocalPlanner

      # 路径方向误差超过约 20°时先原地旋转。
      angular_dist_threshold: 0.35

      # 已进入旋转后，对齐到约 5°再交回 DWB。
      angular_disengage_threshold: 0.087

      # 用前方 0.6m 路径估计航向，减少栅格路径小折线造成的抖动。
      forward_sampling_distance: 0.6

      # 不超过现有 max_vel_theta=0.4。
      rotate_to_heading_angular_vel: 0.30
      max_angular_accel: 3.2

      # 原地旋转前继续使用 local costmap + footprint 做碰撞预测。
      simulate_ahead_time: 1.0

      # 保持现有“到位置即可，不强制终点朝向”的行为。
      rotate_to_goal_heading: false

      # Humble 当前实现支持闭环旋转，使用实际角速度反馈。
      closed_loop: true

      debug_trajectory_details: false

      # --------------------------------------------------------
      # 伪差速约束
      # --------------------------------------------------------
      min_vel_x: 0.0
      max_vel_x: 0.6

      # 禁止 Nav2 横移
      min_vel_y: 0.0
      max_vel_y: 0.0

      # 允许原地旋转
      min_speed_theta: 0.0
      max_vel_theta: 0.4

      min_speed_xy: 0.0
      max_speed_xy: 0.6
      min_in_place_vel_theta: 0.05

      acc_lim_x: 3.4
      decel_lim_x: -3.4
      acc_lim_y: 0.0
      decel_lim_y: 0.0
      acc_lim_theta: 10.3
      decel_lim_theta: -10.3

      vx_samples: 20

      # min/max y 都为 0，所以即使采样多个点，所有 y 速度仍是 0。
      # 比 vy_samples=0 更稳妥。
      vy_samples: 5

      vtheta_samples: 8

      sim_time: 1.2
      linear_granularity: 0.05
      angular_granularity: 0.05

      transform_tolerance: 0.5
      xy_goal_tolerance: 0.5
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      BaseObstacle.scale: 0.02

      PathAlign.scale: 0.5
      PathAlign.forward_point_distance: 0.3

      GoalAlign.scale: 1.0
      GoalAlign.forward_point_distance: 0.3

      PathDist.scale: 1.0
      GoalDist.scale: 8.0

      Oscillation.oscillation_reset_angle: 0.7
      Oscillation.oscillation_reset_dist: 0.15
      Oscillation.scale: 10.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      update_frequency: 10.0
      publish_frequency: 5.0

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05

      # 机器人导航几何完全由 footprint 定义，不使用 URDF。
      # 单位：m，坐标系：base_link。
      footprint: "[[0.4, 0.25], [0.4, -0.25], [-0.4, -0.25], [-0.4, 0.25]]"

      # /nav2_scan 已经是 LaserScan，
      # local costmap 不再重复使用 VoxelLayer。
      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan

        scan:
          topic: /nav2_scan
          data_type: LaserScan

          marking: true
          clearing: true

          max_obstacle_height: 2.0

          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 1.2

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      update_frequency: 0.2
      publish_frequency: 0.2

      global_frame: map
      robot_base_frame: base_link

      resolution: 0.05
      track_unknown_space: true

      # 机器人导航几何完全由 footprint 定义，不使用 URDF。
      # 单位：m，坐标系：base_link。
      footprint: "[[0.4, 0.25], [0.4, -0.25], [-0.4, -0.25], [-0.4, 0.25]]"

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan

        scan:
          topic: /nav2_scan
          data_type: LaserScan

          marking: true
          clearing: true

          max_obstacle_height: 2.0

          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.5

      always_send_full_costmap: true


planner_server:
  ros__parameters:
    use_sim_time: false

    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]

    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 5.0
      use_astar: false
      allow_unknown: true
      use_final_approach_orientation: false


behavior_server:
  ros__parameters:
    use_sim_time: false

    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint

    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - wait

    # Humble / Iron 使用 "/" 插件写法。
    spin:
      plugin: nav2_behaviors/Spin

    backup:
      plugin: nav2_behaviors/BackUp

    wait:
      plugin: nav2_behaviors/Wait

    local_frame: odom
    global_frame: map
    robot_base_frame: base_link

    transform_tolerance: 1.0
    simulate_ahead_time: 2.0

    max_rotational_vel: 0.4
    min_rotational_vel: 0.05
    rotational_acc_lim: 3.2
