# Humble syntax intentionally uses max_points (not the newer min_points name).
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_safe
    transform_tolerance: 0.20
    source_timeout: 0.30
    base_shift_correction: true
    stop_pub_timeout: 1.0

    # Omni robot: protect the full body in every travel direction, not just the
    # front. Polygon sizes are derived from the currently configured 0.8x0.5 m
    # footprint plus margins and should be rechecked after measuring the body.
    polygons: [StopZone, SlowZone]

    StopZone:
      type: polygon
      points: [0.50, 0.35, 0.50, -0.35, -0.50, -0.35, -0.50, 0.35]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: collision_stop_zone
      enabled: true

    SlowZone:
      type: polygon
      points: [0.75, 0.60, 0.75, -0.60, -0.75, -0.60, -0.75, 0.60]
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.35
      visualize: true
      polygon_pub_topic: collision_slow_zone
      enabled: true

    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true
