# ROS 2 Humble / Nav2: stable omnidirectional profile.
# External localization/mapping provides:
#   /map, map->odom, odom->base_link, /odom, /scan

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_controller_selector_bt_node
      - nav2_planner_selector_bt_node
      - nav2_goal_checker_selector_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5

    progress_checker_plugin: progress_checker
    goal_checker_plugins: [precise_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.03
      movement_time_allowance: 15.0

    precise_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      # First-pass target. Tighten only after Fast-LIO/map->odom and the chassis
      # are shown to be quieter than these thresholds.
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.035

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"

      primary_controller: "nav2_mppi_controller::MPPIController"

      angular_dist_threshold: 0.35
      angular_disengage_threshold: 0.18

      forward_sampling_distance: 0.6

      rotate_to_heading_angular_vel: 0.45
      max_angular_accel: 0.8

      simulate_ahead_time: 1.0

      rotate_to_goal_heading: true
      closed_loop: false
      
      motion_model: "Omni"
      time_steps: 50
      model_dt: 0.05
      batch_size: 1200
      iteration_count: 1
      vx_std: 0.20
      vy_std: 0.15
      wz_std: 0.20
      vx_max: 0.50
      vx_min: -0.50
      vy_max: 0.50
      wz_max: 0.60
      prune_distance: 1.5
      transform_tolerance: 0.20
      temperature: 0.30
      gamma: 0.015
      visualize: false
      reset_period: 1.0
      regenerate_noises: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      # No PreferForwardCritic and no RotateToGoal controller: the robot is
      # allowed to translate laterally/diagonally while yaw changes.
      critics:
        [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic,
         PathAlignCritic, PathFollowCritic]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.45
        inflation_layer_name: inflation_layer

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 7.0
        threshold_to_consider: 1.6

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        # Begin blending final yaw while still translating rather than waiting
        # for a separate rotate-in-place stage.
        threshold_to_consider: 1.5
        symmetric_yaw_tolerance: false

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 4
        threshold_to_consider: 0.50
        offset_from_furthest: 16
        # Important for omni: body yaw is not forced to match path tangent.
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 6
        threshold_to_consider: 1.4

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.02
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.30
        w_data: 0.20
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [backup, wait]
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.20
    simulate_ahead_time: 2.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 50.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.50, 0.50, 0.60]
    min_velocity: [-0.50, -0.50, -0.60]
    max_accel: [0.80, 0.80, 1.00]
    max_decel: [-2.00, -2.00, -1.20]
    deadband_velocity: [0.0, 0.0, 0.0]
    odom_topic: /odom
    odom_duration: 0.10
    velocity_timeout: 0.35

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05

      # VERIFY MEASURED BODY OUTLINE. This is the only footprint found in the
      # supplied configuration, not a value inferred from wheelbase/track.
      footprint: "[[0.4, 0.25], [0.4, -0.25], [-0.4, -0.25], [-0.4, 0.25]]"
      footprint_padding: 0.02

      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.20
          obstacle_max_range: 2.5
          obstacle_min_range: 0.20
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.4, 0.25], [0.4, -0.25], [-0.4, -0.25], [-0.4, 0.25]]"
      footprint_padding: 0.02
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.20
          obstacle_max_range: 2.5
          obstacle_min_range: 0.20
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true
