controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    # 控制器列表（这里只写名字 + type）
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 转向：轨迹控制器（平滑插值）
    steering_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # 驱动：速度组控制器
    wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController


# ==================== 关节状态广播器 ====================
joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0


# ==================== 转向位置控制器 ====================
steering_trajectory_controller:
  ros__parameters:
    joints:
      - car_wheel_fl_Link1_Joint
      - car_wheel_fr_Link1_Joint
      - car_wheel_rl_Link1_Joint
      - car_wheel_rr_Link1_Joint

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity   # 如果你的硬件/仿真没有 velocity 接口，可以把这一行删掉

    # 轨迹/目标约束
    allow_partial_joints_goal: false
    constraints:
      goal_time: 0.5                   # 0.5s 内到达目标
      stopped_velocity_tolerance: 0.01

      car_wheel_fl_Link1_Joint:
        trajectory: 0.2
        goal: 0.1
      car_wheel_fr_Link1_Joint:
        trajectory: 0.2
        goal: 0.1
      car_wheel_rl_Link1_Joint:
        trajectory: 0.2
        goal: 0.1
      car_wheel_rr_Link1_Joint:
        trajectory: 0.2
        goal: 0.1

    # 时间轴上用样条插值，避免突然拐角
    interpolation_method: splines


# ==================== 驱动关节：JointGroupVelocityController ====================
wheel_velocity_controller:
  ros__parameters:
    joints:
      - car_wheel_fl_Link2_Joint
      - car_wheel_fr_Link2_Joint
      - car_wheel_rl_Link2_Joint
      - car_wheel_rr_Link2_Joint

    command_interfaces:
      - velocity
    # JointGroupVelocityController 一般不需要配置 state_interfaces

