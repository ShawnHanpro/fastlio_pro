# ========================================
# ⚠️ AMCL 已停用：定位由 RTAB-Map 替代
#   Nav2 bringup 传入 localization=True 后不会启动 AMCL
#   以下配置仅作为备份保留，切换回 AMCL 时取消注释即可
# ========================================
amcl:
  ros__parameters:
    use_sim_time: False
    
    # ========================================
    # ✅ 里程计噪声模型（OmniMotionModel）- 完美适配Swerve
    # ========================================
    alpha1: 0.0005
    alpha2: 0.001
    alpha3: 0.005
    alpha4: 0.005
    alpha5: 0.001
    
    base_frame_id: "base_link"
    
    # ========================================
    # ✅ 激光匹配优化
    # ========================================
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.5
    
    global_frame_id: "map"
    lambda_short: 0.1
    
    laser_likelihood_max_dist: 1.0
    laser_max_range: 30.0
    laser_min_range: 0.4
    
    laser_model_type: "likelihood_field"
    # laser_model_type: "beam"
    
    max_beams: 600
    
    # ========================================
    # ✅ 粒子滤波优化
    # ========================================
    max_particles: 16000
    min_particles: 2000
    
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.95
    
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    
    resample_interval: 1
    
    # ✅ Omni模型完美适配Swerve全向移动
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.02
    tf_broadcast: true
    
    # Explicit scan topic
    scan_topic: /scan
    
    transform_tolerance: 3.0
    
    # ✅ 更新阈值
    update_min_a: 0.15
    update_min_d: 0.10
    
    z_hit: 0.7
    z_max: 0.001
    z_rand: 0.059
    z_short: 0.24

    # ========================================
    # ✅ 初始位姿（关键：确保启动时立即发布 map->odom TF）
    # ========================================
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

