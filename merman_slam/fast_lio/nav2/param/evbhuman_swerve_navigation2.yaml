bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.05
    # ✅ Swerve支持横向移动
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 3.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 10.0

    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      # 对于全向移动的Swerve机器人，设置很大的yaw容差，让机器人只关注位置
      # 设置为 π（180度），这样只要到达位置就算完成任务，不需要关心方向
      yaw_goal_tolerance: 3.14 # 3.14159  # π 弧度，约180度

    # ========================================
    # ✅ DWB本地规划器 - 完美支持Swerve全向移动
    # ========================================
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      
      # ========================================
      # 速度限制（Swerve全向移动）
      # ========================================
      # 线速度（x方向）
      min_vel_x: 0.0                # ✅ Swerve可以倒退
      max_vel_x: 0.6
      acc_lim_x: 3.4
      decel_lim_x: -3.4
      
      # 横向速度（y方向）- Swerve特有
      min_vel_y: 0.0                   # ✅ Swerve可以横向移动
      max_vel_y: 0.0
      acc_lim_y: 0.0
      decel_lim_y: 0.0  
      # 角速度（旋转）
      min_speed_theta: 0.0              # ✅ Swerve可以原地旋转（不需要最小线速度）
      max_vel_theta: 0.4        # ✅ 角速度可以更大
      acc_lim_theta: 10.3
      decel_lim_theta: -10.3
      
      # ========================================
      # 原地旋转（Swerve支持）
      # ========================================
      min_speed_xy: 0.0                 # ✅ 允许原地旋转，无需最小线速度
      max_speed_xy: 0.6
      min_in_place_vel_theta: 0.05      # ✅ 原地旋转最小角速度（大于0表示支持）
      
      # ========================================
      # 轨迹采样
      # ========================================
      vx_samples: 20
      vy_samples: 0                    # ✅ Swerve需要采样横向速度
      vtheta_samples: 4
      sim_time: 1.2
      discretize_by_time: False
      linear_granularity: 0.05
      angular_granularity: 0.05
      
      # ========================================
      # 前向仿真
      # ========================================
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.5
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      
      # ========================================
      # Critics（评分函数）权重
      # ========================================
      # 对于全向移动的Swerve机器人，移除RotateToGoal以避免原地旋转
      # 机器人可以边移动边旋转，不需要先旋转再移动
      critics: ["Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      
      BaseObstacle.scale: 0.02
      PathAlign.scale: 0.5              # 降低路径对齐权重，避免过度旋转
      PathAlign.forward_point_distance: 0.3
      GoalAlign.scale: 1.0              # 降低目标对齐权重
      GoalAlign.forward_point_distance: 0.3
      PathDist.scale: 1.0               # 保持路径距离权重，优先考虑距离
      GoalDist.scale: 8.0               # 提高目标距离权重，优先到达目标位置
      
      Oscillation.oscillation_reset_angle: 0.7
      Oscillation.oscillation_reset_dist: 0.15
      Oscillation.scale: 10.0
      # RotateToGoal 已移除 - Swerve可以边移动边旋转，不需要单独旋转评分

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[0.58, 0.3], [0.58, -0.3], [-0.4, -0.3], [-0.4, 0.3]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        min_obstacle_height: -0.5
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /nav2_scan
          data_type: LaserScan
          marking: true
          clearing: true

          min_obstacle_height: -0.5
          max_obstacle_height: 2.0

          obstacle_min_range: 0.3
          obstacle_max_range: 2.5
          raytrace_min_range: 0.3
          raytrace_max_range: 3.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 1.2

      always_send_full_costmap: true
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 0.2
      publish_frequency: 0.2
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      footprint: "[[0.4, 0.25], [0.4, -0.25], [-0.4, -0.25], [-0.4, 0.25]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    # ✅ 地图文件会通过启动参数传递，这里留空是正确的
    # 启动文件会通过 'map' 参数传递地图路径
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 5.0
      use_astar: false
      allow_unknown: true
      # 对于全向移动的Swerve机器人，设置为false避免在接近目标时强制旋转
      # 机器人可以边移动边调整方向，优先到达目标位置
      use_final_approach_orientation: false

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
      simulate_ahead_time: 2.0
      max_rotational_vel: 1.0
      min_rotational_vel: 0.4
      rotational_acc_lim: 3.2
    backup:
      plugin: "nav2_recoveries/BackUp"
      backup_dist: 0.3
      backup_speed: 0.15
      time_allowance: 10.0
    wait:
      plugin: "nav2_recoveries/Wait"
      wait_duration: 5.0
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 1.0
    use_sim_time: False
    simulate_ahead_time: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

